<!DOCTYPE html>
<!-- 登录页面 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>登录 · SQLFINDER</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232854d7'/%3E%3Cpath d='M9 10h14M9 16h9M9 22h14' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/styles.css">
    <script src="/auth.js" defer></script>
    <script src="/login.js" defer></script>
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-card" aria-labelledby="login-heading">
        <a class="login-brand" href="/">SQLFINDER</a><h1 id="login-heading">登录</h1>
        <p id="login-notice" class="login-notice" role="status" hidden></p>
        <form id="login-form" novalidate>
            <label for="username">用户名</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            <label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required>
            <p id="login-message" class="login-message" role="alert" hidden></p>
            <button id="login-button" class="primary-button" type="submit"><span>登录</span><span aria-hidden="true">↗</span></button>
        </form>
    </section>
</main>
</body>
</html>
