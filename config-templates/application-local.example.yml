# 部署配置示例
# Copy to config/application-local.yml and fill in local values, or configure the environment variables.
spring:
  datasource:
    url: ${SQLFINDER_DB_URL:jdbc:mysql://127.0.0.1:3306/sqlfinder_sakila?useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SQLFINDER_DB_USERNAME:sqlfinder_reader}
    password: ${SQLFINDER_DB_PASSWORD:}
sqlfinder:
  metadata:
    catalog: sqlfinder_sakila
    allowed-tables: [actor, address, category, city, country, customer, film, film_actor, film_category, film_text, inventory, language, payment, rental, staff, store]
  llm:
    api-key: ${DEEPSEEK_API_KEY:}
